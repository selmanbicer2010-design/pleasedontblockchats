<!DOCTYPE html>
<html>
<body>

    <style>
      li {
        font-family: sans-serif;
        padding: 4px;
      }
      #ul_messagelist {
        list-style: none;
      }
      #input_messagebox {
          position: absolute;
          left: 2%;
          top: 90%;
          width: 70%;
      }
      #button_messagesend {
          position: absolute;
          left: 74%;
          top: 90%;
          width: 24%;
      }
    </style>

    <input id="input_namesetter" type="text" placeholder="Enter your name here">
    <button id="button_nameset" onclick="setName()">Change name</button>

    <input id="input_messagebox" type="text" placeholder="Send a message...">
    <button id="button_messagesend" onclick="sendMessage()">Send</button>
    <ul id="ul_messagelist"></ul>

    <script>
    const socket = new WebSocket("wss://pleasedontblockchats.onrender.com/ws");

    let messages = [];
    let name = "Anonymous";

    function setName() {
      const inputbox = document.getElementById("input_namesetter");
      name = inputbox.value;
      inputbox.placeholder = "Currently chatting as " + name;
    }

    socket.onmessage = function(event) {
      messages.push(event.data);
      render();
    };

    function sendMessage() {
      const inputbox = document.getElementById("input_messagebox");
      socket.send(name + ": " + inputbox.value);
      inputbox.value = "";
    }

    function render() {
      const list = document.getElementById("ul_messagelist");
      list.innerHTML = "";
      for (let i = messages.length - 1; i >= 0; i--) {
        const li = document.createElement("li");
        li.textContent = messages[i];
        list.appendChild(li);
      }
    }
    </script>

</body>
</html>
