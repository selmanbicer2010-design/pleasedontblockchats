<!DOCTYPE html>
<html>
<body>
    <input id="namesetterbox" type="text" placeholder="Enter your name here">
    <button onclick="setName()">Change name</button>

    <input id="entrybox" type="text" placeholder="Send a message...">
    <button onclick="sendMessage()">Send</button>
    <ul id="messagelist"></ul>

    <script>
    const socket = new WebSocket("wss://pleasedontblockchats.onrender.com/ws");

    let messages = [];
    let name = "Anonymous";

    function setName() {
      const inputbox = document.getElementById("namesetterbox");
      name = inputbox.value;
      inputbox.placeholder = "Currently chatting as " + name;
    }

    socket.onmessage = function(event) {
      messages.push(event.data);
      render();
    };

    function sendMessage() {
      const inputbox = document.getElementById("entrybox");
      socket.send(name + ": " + inputbox.value);
      inputbox.value = "";
    }

    function render() {
      const list = document.getElementById("messagelist");
      list.innerHTML = "";
      for (let i = 0; i < messages.length; i++) {
        const li = document.createElement("li");
        li.textContent = messages[i];
        list.appendChild(li);
      }
    }
    </script>

</body>
</html>
