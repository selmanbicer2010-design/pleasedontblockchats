<!DOCTYPE html>
<html>
<body>

    <style>
      li {
        font-family: sans-serif;
        padding: 0%;
      }
      #input_messagebox {
          position: absolute;
          left: 2%;
          top: 95%;
          width: 80%;
      }
      #button_messagesend {
        position: absolute;
        left: 84%;
        top: 95%;
        width: 14%;
      }
      #ul_messagelist {
        position: absolute;
        bottom: 10%;
        left: 2%;
        width: 90%;
        max-height: 80%;
        overflow-y: auto;
        list-style: none;
        display: flex;
        flex-direction: column-reverse;
      }
    </style>

    <input id="input_namesetter" type="text" placeholder="Enter your name here">
    <button id="button_nameset" onclick="setName()">Change name</button>

    <input id="input_messagebox" type="text" placeholder="Send a message...">
    <button id="button_messagesend" onclick="sendMessage()">Send</button>
    <ul id="ul_messagelist"></ul>

    <script>
    const SERVER_CONNECTED = true
    const socket = new WebSocket("wss://pleasedontblockchats.onrender.com/ws");

    let messages = [];
    let name = "Anonymous";

    const namesetter = document.getElementById("input_namesetter");
    const messagebox = document.getElementById("input_messagebox");
    const messagelist = document.getElementById("ul_messagelist");

    function setName() {
      name = namesetter.value;
      namesetter.placeholder = "Currently chatting as " + name;
    }

    socket.onmessage = function(event) {
      messages.push(event.data);
      render();
    };

    function sendMessage() {
      let msg = name + ": " + messagebox.value;
      if (SERVER_CONNECTED) {
        socket.send(msg);
      }
      else {
        messages.push(msg);
        render();
      }
      messagebox.value = "";
    }

    function render() {
      messagelist.innerHTML = "";
      for (let i = 0; i < messages.length; i++) {
        const li = document.createElement("li");
        li.textContent = messages[i];
        list.appendChild(li);
      }
    }
    </script>

</body>
</html>
