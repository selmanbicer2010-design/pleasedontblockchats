<!DOCTYPE html>
<html>
<body>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
      li {
        font-family: sans-serif;
        padding: 0%;
      }
      p {
        font-family: sans-serif;
      }
      #input_messagetextbox {
          position: absolute;
          left: 2%;
          top: 95%;
          width: 80%;
      }
      #button_messagesend {
        position: absolute;
        left: 84%;
        top: 95%;
        width: 14%;
      }
      #ul_messagelist {
        position: absolute;
        bottom: 10%;
        left: 2%;
        width: 90%;
        max-height: 80%;
        overflow-y: auto;
        list-style: none;
        display: flex;
        flex-direction: column-reverse;
      }
    </style>

    <input id="input_nametextbox" type="text" placeholder="Enter your name here">
    <button id="button_nameset" onclick="setName()">Change name</button>

    <input id="input_messagetextbox" type="text" placeholder="Send a message...">
    <button id="button_messagesend" onclick="sendMessage()">Send</button>

    <ul id="ul_messagelist"></ul>

    <script>
    const SERVER_CONNECTED = true
    const socket = new WebSocket("wss://pleasedontblockchats.onrender.com/ws");

    const defaultname = "__NONAMESET__";

    let messages = [];
    let name = defaultname;

    const nametextbox = document.getElementById("input_nametextbox");
    const nameset = document.getElementById("button_nameset");

    const messagetextbox = document.getElementById("input_messagetextbox");
    const messagesend = document.getElementById("button_messagesend");

    const messagelist = document.getElementById("ul_messagelist");

    nametextbox.addEventListener("keydown", function(e) {
      if (e.key == "Enter") {
          setName();
        }
    });

    messagetextbox.addEventListener("keydown", function(e) {
      if (e.key == "Enter") {
          sendMessage();
        }
    });

    function setName() {
      name = nametextbox.value;
      nametextbox.placeholder = "Currently chatting as " + name;
    }

    socket.onmessage = function(event) {
      messages.push(event.data);
      render();
    };

    function sendMessage() {
      if (name == defaultname) {
        const p = document.createElement("p");
        p.textContent = "Set a name first!";
        p.style.position = "absolute";
        p.style.left = "50%";
        p.style.top = "50%";
        document.body.appendChild(p);
        setTimeout(function() {
          p.remove();
        }, 2000);
        return;
      }
      let msg = name + ": " + messagetextbox.value;
      if (SERVER_CONNECTED) {
        socket.send(msg);
      }
      else {
        messages.push(msg);
        render();
      }
      messagetextbox.value = "";
    }

    function render() {
      messagelist.innerHTML = "";
      for (let i = messages.length - 1; i >= 0; i--) {
        const li = document.createElement("li");
        li.textContent = messages[i];
        messagelist.appendChild(li);
      }
    }
    </script>

</body>
</html>
