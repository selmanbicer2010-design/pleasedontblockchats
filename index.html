<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
      li {
        font-family: sans-serif;
        padding: 0%;
      }
      p {
        font-family: sans-serif;
      }
      #input_messagetextbox {
          position: absolute;
          left: 2%;
          top: 95%;
          width: 80%;
      }
      #button_messagesend {
        position: absolute;
        left: 84%;
        top: 95%;
        width: 14%;
      }
      #ul_messagelist {
        position: absolute;
        bottom: 10%;
        left: 2%;
        width: 90%;
        max-height: 80%;
        overflow-y: auto;
        list-style: none;
        display: flex;
        flex-direction: column-reverse;
      }
    </style>
</head>
<body>
    <script>
    class ClientApplication
    {
      constructor() {
        this.messages = [];
        this.userlist = [];
      }
    }

    class ClientSideClientTextInfo {
      constructor(msgtype, jsobj) {
        const jsobjcopy = { ...jsobj };
        jsobjcopy.type = msgtype;
        this.dict_ = jsobjcopy;
        this.data_ = JSON.stringify(jsobjcopy);
      }

      jsonstr() {
        return this.data_;
      }

      dict() {
        return this.dict_;
      }
    }

    class Client {
      constructor(websocket, uuid, username) {
        this.websocket = websocket;
        this.uuid = uuid;
        this.username = username;
      }

      socketsend(message) {
        this.websocket.send(message.jsonstr())
      }
    }

    function localStorageFallback(itemname, fallback)
    {
      let data = localStorage.getItem(itemname);

      if (data === null) {
        data = fallback;
        localStorage.setItem(itemname, fallback);
      }
      return data;
    }

    let uuid = localStorageFallback("uuid", crypto.randomUUID());
    let username = localStorageFallback("username", "User");

    const socket = new WebSocket("wss://pleasedontblockchats.onrender.com/ws")
    const client = new Client(socket, uuid, username);
    const application = new ClientApplication();

    client.websocket.onopen = function() {
      const identify = new ClientSideClientTextInfo("onopen", { uuid: uuid });
      client.socketsend(identify);
      const nameset = new ClientSideClientTextInfo("nameset", { newname: username });
      client.socketsend(nameset);
    }

    client.websocket.onmessage = function(event) {
      if (CURRENT_SCENE != TEXTING_SCENE) return;
      const parsed = JSON.parse(event.data);
      const info = new ClientSideClientTextInfo(parsed.type, parsed);
      if (info.dict().type == "chat")
      {
        application.messages.push(info.dict().sender + ": " + info.dict().body);
        renderChats();
      }
      else if (info.dict().type == "userlist")
      {
        if (info.dict().mode == "changed" || info.dict().mode == "left")
        {
          application.userlist.splice(application.userlist.indexOf(info.dict().oldusername), 1);
        }
        if (info.dict().mode == "changed" || info.dict().mode == "joined")
        {
          application.userlist.push(info.dict().newusername);
        }
        renderUserlist();
      }
    };

    const NULL_SCENE = 0;
    const TEXTING_SCENE = 1;

    let CURRENT_SCENE = NULL_SCENE;

    class Scene {
      constructor(sceneenum, func) {
        this.sceneenum = sceneenum;
        this.func = func;
        this.elements = null;
      }

      load() {
        this.elements = this.func();
        CURRENT_SCENE = this.sceneenum;
      }
    }

    function loadScene(scene) {
      document.body.innerHTML = '';
      scene.load();
    }

    function createDocumentElement(name, objecttype, func = function(e){}) {
      const object = document.createElement(objecttype);
      func(object);
      object.id = name;
      document.body.appendChild(object);
      return object;
    }

    let darkmode = false;
    let textcolor = '#000000';

    const textingscene = new Scene(TEXTING_SCENE, function() {
      const nametextbox = createDocumentElement("input_nametextbox", "input", function(e) {
        e.type = "text";
        e.placeholder = "Enter your name here...";
        e.value = username;
        e.addEventListener("keydown", function(e) { if (e.key == "Enter") { setName(); } });
        e.style.width = "20%";
        e.style.height = "auto";
      });

      const nameset = createDocumentElement("button_nameset", "button", function(e) {
        e.textContent = "Set name";
        e.onclick = setName;
        e.style.position = "absolute";
        e.style.left = "22%";
        e.style.top = "1.09%";
        e.style.width = "10%";
        e.style.height = "auto";
      });
      const messagetextbox = createDocumentElement("input_messagetextbox", "input", function(e) {
        e.type = "text";
        e.placeholder = "Enter your message here...";
        e.addEventListener("keydown", function(e) { if (e.key == "Enter") { sendMessage(); } });
      });
      const messagesend = createDocumentElement("button_messagesend", "button", function(e) {
        e.textContent = "Send";
        e.onclick = sendMessage;

      });

      const messagelist = createDocumentElement("ul_messagelist", "ul");

      const userlist = createDocumentElement("ul_userlist", "ul");

      const logo = createDocumentElement("logo", "img", function(e) {
        e.src = "images/plsdontblockchats.png";
        e.alt = "pleasedontblockchats.com logo";
        e.style.width = "10%";
        e.style.height = "auto";
        e.style.position = "absolute";
        e.style.left = "85%";
        e.style.top = "2%";

      });

      const modeswitch = createDocumentElement("button_modeswitch", "button", function (e) {
        e.textContent = "Switch to dark mode"
        e.onclick = function() {
          darkmode = !darkmode;
          if (darkmode) {
            e.textContent = "Switch to light mode"
            document.body.style.backgroundColor = '#010103';
            textcolor = '#eeeeee';
            logo.style.backgroundColor = 'white';
          }
          else {
            e.textContent = "Switch to dark mode"
            document.body.style.backgroundColor = '#ffffff';
            textcolor = '#000000';
          }
          renderChats();
          renderUserlist();
          }
          e.style.position = "absolute";
          e.style.left = "33%";
          e.style.top = "1.09%";
          e.style.width = "10%";
          e.style.height = "auto";
      });

      createDocumentElement("", "p", function (e) {
        e.textContent = "Your UUID: " + uuid;
         e.style.position = "absolute";
        e.style.left = "45%";
        e.style.top = "0.5%";
        e.style.fontSize = "60%";
        e.style.width = "20%";
        e.style.height = "auto";
      });

      return {
          nametextbox,
          messagetextbox,
          messagelist,
          userlist
        };
    });

    function setName() {
      if (CURRENT_SCENE != TEXTING_SCENE) return;
      const nametextbox = textingscene.elements.nametextbox;
      if (nametextbox.value.trim() == "") {
        createDocumentElement("warning", "p", function(e) {
          e.textContent = "Set a valid name first!";
          e.style.position = "absolute";
          e.style.left = "50%";
          e.style.top = "50%";
          setTimeout(function() { e.remove(); }, 2000);
        });
        return;
      }
      client.username = nametextbox.value;
      localStorage.setItem("username", client.username);
      nametextbox.placeholder = "Currently chatting as " + client.username;
      const nameset = new ClientSideClientTextInfo("nameset", { newname: client.username })
      client.socketsend(nameset)
    }

    function sendMessage() {
      if (CURRENT_SCENE != TEXTING_SCENE) return;
      if (client.username.trim() == "") {
        createDocumentElement("warning", "p", function(e) {
          e.textContent = "Set a name first!";
          e.style.position = "absolute";
          e.style.left = "50%";
          e.style.top = "50%";
          setTimeout(function() { e.remove(); }, 2000);
        });
        return;
      }
      const messagetextbox = textingscene.elements.messagetextbox;
      if (messagetextbox.value.trim() == "") return;
      const message = new ClientSideClientTextInfo("chat", { sender: client.username, body: messagetextbox.value });
      client.socketsend(message);
      messagetextbox.value = "";
    }

    function renderChats() {
      if (CURRENT_SCENE != TEXTING_SCENE) return;
      const messagelist = textingscene.elements.messagelist;
      messagelist.innerHTML = "";
      for (let i = application.messages.length - 1; i >= 0; i--) {
        const li = document.createElement("li");
        li.style.color = textcolor;
        li.textContent = application.messages[i];
        messagelist.appendChild(li);
      }
    }

    function renderUserlist() {
      if (CURRENT_SCENE != TEXTING_SCENE) return;
      const userlist = textingscene.elements.userlist;
      userlist.innerHTML = "";
      for (let i = 0; i < application.userlist.length; i++) {
        const li = document.createElement("li");
        li.style.color = textcolor;
        li.textContent = application.userlist[i];
        userlist.appendChild(li);
      }
    }

    loadScene(textingscene);

    </script>
</body>
</html>
